[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-image-manipulator"
dynamic = ["version"]
description = "On-device image processing for pyxpo apps: info, crop, resize, convert, strip metadata, compress under a size."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "image", "resize", "crop", "rotate", "compress"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a1,<0.2"]

[project.optional-dependencies]
desktop = ["Pillow>=9"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo/tree/main/packages/image-manipulator"
Documentation = "https://github.com/pyxpo/pyxpo/blob/main/packages/image-manipulator/README.md"
Changelog = "https://github.com/pyxpo/pyxpo/blob/main/packages/image-manipulator/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo/tree/main/packages/image-manipulator"
Issues = "https://github.com/pyxpo/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
image-manipulator = "pyxpo_image_manipulator"

[tool.setuptools]
packages = ["pyxpo_image_manipulator"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_image_manipulator.__version__" }

[tool.setuptools.package-data]
pyxpo_image_manipulator = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
