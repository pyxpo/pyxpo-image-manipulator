# Tests this package against the latest pyxpo core from main.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pyxpo @ git+https://github.com/pyxpo/pyxpo.git" pytest
      # --no-deps: core comes from main above; the package may already ask for a core version not yet on PyPI.
      - run: pip install --no-deps -e .
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: pyxpo/pyxpo
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      # Same check the release runs: wheel and sdist carry pyxpo-module.json, Swift, Kotlin and the entry point.
      - run: python core/tools/build_packages.py --path pkg --outdir dist/
